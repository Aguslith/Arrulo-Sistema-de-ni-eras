<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="6" y1="4" x2="58" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFE6DC" />
      <stop offset="55%" stop-color="#FFF4D8" />
      <stop offset="100%" stop-color="#DFF7EC" />
    </linearGradient>
    <linearGradient id="moonGrad" x1="15" y1="14" x2="45" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F59076" />
      <stop offset="100%" stop-color="#DF6246" />
    </linearGradient>
    <linearGradient id="starGrad" x1="36" y1="17" x2="47" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFE07D" />
      <stop offset="100%" stop-color="#F4B731" />
    </linearGradient>
  </defs>

  <!-- Soft rounded pastel squircle -->
  <rect x="2" y="2" width="60" height="60" rx="18" fill="url(#bgGrad)" />
  <rect x="2.75" y="2.75" width="58.5" height="58.5" rx="17.25" stroke="#F2CFC1" stroke-width="1.5" />

  <!-- Subtle warm glow behind the lullaby star -->
  <circle cx="40.5" cy="25.5" r="12.5" fill="#FFFFFF" opacity="0.58" />

  <!-- Gracefully tapered cradling crescent moon -->
  <path
    d="M35.8 13.2C24.2 13.8 15.2 23.1 15.4 34.4C15.6 44.8 24.1 52.2 34.4 52.2C40.9 52.2 46.6 48.9 49.8 43.8C45.2 45.9 39.4 45.6 34.7 42.6C28.4 38.6 26.2 30.2 29.8 23.4C31.3 20.5 33.4 16.4 35.8 13.2Z"
    fill="url(#moonGrad)"
  />

  <!-- Soft golden 4-point lullaby star nestled inside the crescent -->
  <path
    d="M41.5 17C42.2 21.3 44.2 23.3 48.5 24C44.2 24.7 42.2 26.7 41.5 31C40.8 26.7 38.8 24.7 34.5 24C38.8 23.3 40.8 21.3 41.5 17Z"
    fill="url(#starGrad)"
  />
  <!-- Companion mint sparkle dot -->
  <circle cx="50" cy="15.2" r="2.3" fill="#4DC096" />

  <!-- Fluffy protective cloud cleanly cradling the base -->
  <path
    d="M25.2 53.4H45.6C49.7 53.4 53 50.2 53 46.2C53 42.6 50.3 39.6 46.8 39.1C45.7 34.8 41.8 31.8 37.2 31.8C32.8 31.8 29.1 34.6 27.9 38.6C24 39 21 42.2 21 46.2C21 50.2 22.8 53.4 25.2 53.4Z"
    fill="#FFFFFF"
  />
  <!-- Gentle sage-mint cradling smile -->
  <path
    d="M29.4 47.6C32.9 50.1 39.5 50.1 43 47.6"
    stroke="#4DC096"
    stroke-width="2.6"
    stroke-linecap="round"
  />
</svg>
